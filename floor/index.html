<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F4F3A">
<title>Star Floor</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --g:#2F4F3A; --g2:#3d6549; --sand:#c4a574; --bg:#f6f1e8; --ink:#1c241c; --card:#fffdf8; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--g); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:2; }
  header h1 { margin:0; font-size:1.15rem; font-weight:650; letter-spacing:.02em; }
  header p { margin:2px 0 0; opacity:.8; font-size:.8rem; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e4dccf; display:flex; padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; padding:10px 0 8px; font-size:.75rem; color:#666; }
  nav button.on { color:var(--g); font-weight:700; }
  main { padding:12px 12px 88px; }
  .jumps { display:flex; gap:8px; margin:0 0 12px; }
  .jumps button {
    flex:1; border:0; border-radius:12px; padding:12px 6px; background:#fff; color:var(--ink);
    font-weight:700; font-size:.85rem; box-shadow:0 1px 0 #e8dfd0;
  }
  .jumps button.on { background:var(--g); color:#fff; }
  .card { background:var(--card); border-radius:14px; padding:0; margin:0 0 10px; box-shadow:0 1px 0 #e8dfd0; overflow:hidden; }
  .card.head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; cursor:pointer; }
  .card h2 { margin:0; font-size:1rem; }
  .card .chev { color:#889; font-size:1.1rem; }
  .card.open .chev { transform:rotate(90deg); }
  .muted { color:#667; font-size:.85rem; }
  .body { display:none; padding:0 14px 12px; }
  .card.open .body { display:block; }
  label.row { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid #efe8db; }
  label.row:last-child { border-bottom:0; }
  input[type=checkbox] { width:22px; height:22px; margin-top:2px; accent-color:var(--g); }
  .out { display:flex; flex-wrap:wrap; gap:8px; }
  .out button { background:var(--g); color:#fff; border:0; border-radius:999px; padding:10px 14px; }
  .out button.sent { background:#8a9; }
  input[type=search], select, textarea, input[type=text] {
    width:100%; padding:10px 12px; border:1px solid #ddd3c4; border-radius:10px; font:inherit; background:#fff;
  }
  .find-item { padding:10px 0; border-bottom:1px solid #efe8db; }
  .find-item b { display:block; }
  .toast { position:fixed; left:12px; right:12px; bottom:76px; background:var(--g); color:#fff; padding:12px 14px; border-radius:12px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Star Floor</h1>
  <p>Paihia Star · rooms, find, ran-out</p>
</header>
<main id="app"></main>
<nav>
  <button class="on" data-tab="rooms">Rooms</button>
  <button data-tab="find">Find</button>
  <button data-tab="out">Out</button>
</nav>
<div class="toast" id="toast"></div>
<script src="../config.js"></script>
<script>
const STUDIO = [
  "Strip bedding",
  "Sheets to pick-up bag",
  "Towels, pillowcases and shower curtain to in-house laundry",
  "Take mats outside to air — bathroom, kitchen, entrance",
  "Jif and hot water in sink — wipe: countertops, side tables, dining table, fridge shelves, microwave interior, cupboard shelves",
  "Bathroom vanity",
  "Bathroom mirror",
  "Towel rack",
  "Boil kettle — spray toilet, pour boiled water, wipe and dry",
  "Top up soaps, shampoo, conditioner, toilet paper",
  "Make bed/s",
  "Dress room — pillowcases, coverlets, towels in rack, dish cloth, tea towel, kitchen hand towel, shower mat",
  "Hang fresh shower curtain",
  "Check consumables — teabags, coffee, sugar, biscuits, milk",
  "Boil kettle — Jif and antiseptic in mop bucket",
  "Mop floors — flood mop then regular mop bathroom / regular mop kitchen and entry",
  "Vacuum",
  "Bring mats back in"
];
const APT = [
  "Strip bedding",
  "Sheets to pick-up bag",
  "Towels, pillowcases and shower curtain to in-house laundry",
  "Take mats outside to air — bathroom, kitchen, entrance",
  "Jif and hot water in sink — wipe: countertops, side tables, dining table, fridge shelves, microwave interior, cupboard shelves",
  "Bathroom vanity",
  "Bathroom mirror",
  "Shower glass",
  "Towel rack",
  "Boil kettle — spray toilet, pour boiled water, wipe and dry",
  "Top up soaps, shampoo, conditioner, toilet paper",
  "Make bed/s",
  "Dress room — pillowcases, coverlets, towels in rack, dish cloth, tea towel, kitchen hand towel, shower mat",
  "Hang fresh shower curtain",
  "Check consumables — teabags, coffee, sugar, biscuits, milk",
  "Boil kettle — Jif and antiseptic in mop bucket",
  "Mop floors — flood mop then regular mop bathroom / regular mop kitchen and entry",
  "Vacuum",
  "Bring mats back in"
];
const TASKS = {
  r2: { short:"2", title:"Room 2 · Studio", items:STUDIO },
  r3: { short:"3", title:"Room 3 · Studio", items:STUDIO },
  r1: { short:"1", title:"Room 1 · 2BR", items:APT },
  grounds: { short:"Yard", title:"Grounds", items:[
    "Clear paths of leaves / debris",
    "Check carpark area",
    "Mow and edge lawns",
    "Water plants if needed",
    "Empty outdoor bin if needed",
    "Check letterbox",
    "Inspect exterior of all units for issues",
    "Note any maintenance tasks — waterblasting, paint touch-ups, tree pruning, etc."
  ]}
};
const FIND_FALLBACK = [
  ["Vacuum","Main house. Return it when the room is done."],
  ["Towels","Laundry shelf"],
  ["Sheets","House hall / ApparelMaster bag"],
  ["Toilet rolls","Linen cupboard, second shelf"],
  ["Light bulbs","House hall drawer"],
  ["Batteries","House hall drawer"],
  ["Room 1 squeegee","Under Room 1 bathroom sink"],
  ["Cleaning caddy","Laundry"],
  ["Guest keys","Key board — ask Chris"]
];
const OUT_ITEMS = ["Toilet rolls","Paper towels","Towels","Sheets","Tea towels","Light bulbs","Batteries","Hand soap","Dishwash liquid","Bin bags","Coffee","Teabags","Sugar","Biscuits"];
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2200); }
function keyFor(list){ return "floor-"+list+"-"+new Date().toISOString().slice(0,10); }
function loadTicks(list){ try{ return JSON.parse(localStorage.getItem(keyFor(list))||"[]"); }catch{ return []; } }
function saveTicks(list, arr){ localStorage.setItem(keyFor(list), JSON.stringify(arr)); }
function openList(id){
  sessionStorage.setItem("floor-open", id);
  document.querySelectorAll(".card[data-list]").forEach(c=>c.classList.toggle("open", c.dataset.list===id));
  document.querySelectorAll(".jumps button").forEach(b=>b.classList.toggle("on", b.dataset.go===id));
  const el=document.querySelector('.card[data-list="'+id+'"]');
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
function renderRooms(){
  const app=document.getElementById("app");
  const open = sessionStorage.getItem("floor-open") || "r2";
  const jumps = Object.entries(TASKS).map(([id,pack])=>{
    const ticks=loadTicks(id);
    const d=ticks.filter(Boolean).length;
    return `<button data-go="${id}" class="${id===open?"on":""}">${pack.short}<br><span class="muted" style="font-weight:500;color:inherit;opacity:.75">${d}/${pack.items.length}</span></button>`;
  }).join("");
  const cards = Object.entries(TASKS).map(([id,pack])=>{
    const ticks=loadTicks(id);
    const n=pack.items.length;
    const d=ticks.filter(Boolean).length;
    return `<section class="card ${id===open?"open":""}" data-list="${id}">
      <div class="head">
        <div>
          <h2>${pack.title}</h2>
          <p class="muted count">${d}/${n} · show Chris the finished room</p>
        </div>
        <span class="chev">›</span>
      </div>
      <div class="body">
        ${pack.items.map((t,i)=>`<label class="row"><input type="checkbox" data-i="${i}" ${ticks[i]?"checked":""}><span>${t}</span></label>`).join("")}
      </div>
    </section>`;
  }).join("");
  app.innerHTML = `<div class="jumps">${jumps}</div>${cards}`;
  app.querySelectorAll(".jumps button").forEach(b=>b.onclick=()=>openList(b.dataset.go));
  app.querySelectorAll(".card .head").forEach(h=>{
    h.onclick=()=>{
      const id=h.parentElement.dataset.list;
      if(h.parentElement.classList.contains("open")) {
        h.parentElement.classList.remove("open");
        sessionStorage.removeItem("floor-open");
        document.querySelectorAll(".jumps button").forEach(b=>b.classList.remove("on"));
      } else openList(id);
    };
  });
  app.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.onchange=()=>{
      const list=cb.closest("[data-list]").dataset.list;
      const ticks=loadTicks(list);
      ticks[Number(cb.dataset.i)]=cb.checked;
      saveTicks(list,ticks);
      const pack=TASKS[list];
      const d=ticks.filter(Boolean).length;
      cb.closest(".card").querySelector(".count").textContent=d+"/"+pack.items.length+" · show Chris the finished room";
      const jump=document.querySelector('.jumps button[data-go="'+list+'"]');
      if(jump) jump.innerHTML=pack.short+'<br><span class="muted" style="font-weight:500;color:inherit;opacity:.75">'+d+'/'+pack.items.length+'</span>';
    };
  });
}
function parseCsv(text){
  const rows=[]; let row=[], cell="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"' && text[i+1]==='"'){ cell+='"'; i++; } else if(c==='"') q=false; else cell+=c; }
    else { if(c==='"') q=true; else if(c===','){ row.push(cell); cell=""; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; } else if(c!=='\r') cell+=c; }
  }
  if(cell||row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function renderFind(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="card" style="padding:14px"><input type="search" id="q" placeholder="Where is…"><div id="list"></div></div>`;
  let rows=FIND_FALLBACK;
  try{
    const res=await fetch(window.STAR_OPS.csv("Find"));
    if(res.ok){ const t=await res.text(); const all=parseCsv(t).slice(1).filter(r=>r[0]); if(all.length) rows=all; }
  }catch{}
  const draw=()=>{
    const q=(document.getElementById("q").value||"").toLowerCase();
    document.getElementById("list").innerHTML=rows.filter(r=>!q||(r[0]+" "+r[1]).toLowerCase().includes(q))
      .map(r=>`<div class="find-item"><b>${r[0]}</b><span class="muted">${r[1]}</span></div>`).join("")||"<p class='muted'>Nothing matches.</p>";
  };
  document.getElementById("q").oninput=draw; draw();
}
function renderOut(){
  const app=document.getElementById("app");
  const url=window.STAR_OPS && window.STAR_OPS.SCRIPT_URL;
  app.innerHTML=`<section class="card" style="padding:14px">
    <h2 style="margin:0 0 8px">Used the last one</h2>
    <p class="muted">${url ? "Sends to Chris’s sheet. Needs Wi‑Fi." : "Script URL not set yet — tap will fail until config.js has SCRIPT_URL."}</p>
    <p class="muted" style="margin-top:8px">Room (optional)</p>
    <select id="room"><option value="">Not sure</option><option>1</option><option>2</option><option>3</option></select>
    <div class="out" style="margin-top:12px">${OUT_ITEMS.map(i=>`<button data-item="${i}">${i}</button>`).join("")}</div>
  </section>`;
  app.querySelectorAll(".out button").forEach(b=>{
    b.onclick=async()=>{
      if(!window.STAR_OPS.SCRIPT_URL){ toast("No script URL yet"); return; }
      b.disabled=true;
      try{
        await fetch(window.STAR_OPS.SCRIPT_URL, {
          method:"POST",
          mode:"no-cors",
          headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({ action:"usedLast", item:b.dataset.item, room:document.getElementById("room").value })
        });
        b.classList.add("sent"); toast("Sent: "+b.dataset.item);
      }catch{ toast("Failed — get onto Wi‑Fi"); }
      b.disabled=false;
    };
  });
}
const tabs={ rooms:renderRooms, find:renderFind, out:renderOut };
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); tabs[b.dataset.tab]();
  };
});
renderRooms();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
